<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fitness 助手</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ==================== 登录/注册区域 ==================== -->
    <div id="auth-page">
        <div class="auth-card">
            <h1 class="auth-title">AI Fitness 助手</h1>
            <p class="auth-subtitle">你的专属智能健身教练</p>

            <!-- 切换标签 -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">登录</button>
                <button class="auth-tab" data-tab="register">注册</button>
            </div>

            <!-- 登录表单 -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-username">用户名</label>
                    <input type="text" id="login-username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="login-password">密码</label>
                    <input type="password" id="login-password" placeholder="请输入密码" required>
                </div>
                <p id="login-error" class="form-error"></p>
                <button type="submit" class="btn btn-primary btn-full">登 录</button>
            </form>

            <!-- 注册表单 -->
            <form id="register-form" class="auth-form" style="display:none;">
                <div class="form-group">
                    <label for="register-username">用户名</label>
                    <input type="text" id="register-username" placeholder="3-50个字符" minlength="3" maxlength="50" required>
                </div>
                <div class="form-group">
                    <label for="register-password">密码</label>
                    <input type="password" id="register-password" placeholder="6-20个字符" minlength="6" maxlength="20" required>
                </div>
                <p id="register-error" class="form-error"></p>
                <button type="submit" class="btn btn-primary btn-full">注 册</button>
            </form>
        </div>
    </div>

    <!-- ==================== 主应用区域（登录后可见） ==================== -->
    <div id="app-page" class="app-layout" style="display:none;">

        <!-- 侧边栏 -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-logo">AI Fitness</h2>
            </div>
            <button id="btn-new-conv" class="btn btn-primary btn-full">+ 新对话</button>
            <nav id="conv-list" class="conv-list">
                <!-- 动态渲染会话列表 -->
            </nav>
            <div class="sidebar-footer">
                <span id="current-user" class="user-name"></span>
                <button id="btn-logout" class="btn btn-text">登出</button>
            </div>
        </aside>

        <!-- 移动端遮罩 -->
        <div id="sidebar-overlay" class="sidebar-overlay" style="display:none;"></div>

        <!-- 聊天区域 -->
        <main class="chat-area">
            <!-- 移动端汉堡菜单 -->
            <div class="mobile-header">
                <button id="btn-menu" class="btn-icon" title="菜单">☰</button>
                <span class="mobile-title">AI Fitness</span>
            </div>

            <!-- 无会话时的占位 -->
            <div id="chat-placeholder" class="chat-placeholder">
                <div class="placeholder-icon">💪</div>
                <h2>AI Fitness 助手</h2>
                <p>选择一个会话或创建新对话，开始你的健身之旅</p>
            </div>

            <!-- 消息列表 -->
            <div id="chat-messages" class="chat-messages" style="display:none;">
                <!-- 动态渲染消息 -->
            </div>

            <!-- 输入区域 -->
            <div id="chat-input-area" class="chat-input-area" style="display:none;">
                <div class="chat-input-row">
                    <textarea id="msg-input" placeholder="输入你的问题，比如：如何制定减脂计划？" rows="1"></textarea>
                    <button id="btn-send" class="btn btn-primary">发送</button>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
